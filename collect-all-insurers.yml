name: Collect insurance management disclosures

# 자동 정기 실행은 삼성화재·메리츠화재·현대해상 수집 경로가 검증된 뒤
# 다시 활성화합니다. 우선 DB손해보험과 KB손해보험만 수동 시험합니다.
# schedule:
#   - cron: "0 0 5 * *"

on:
  workflow_dispatch:
    inputs:
      lookback_years:
        description: "공시 목록에서 확인할 최근 연수"
        required: true
        default: "1"
      companies:
        description: "수집 회사 코드 (쉼표 구분)"
        required: true
        default: "dbins,kb"
      dry_run:
        description: "목록/PDF 링크만 확인 (실제 저장 안 함)"
        type: boolean
        required: true
        default: false
      max_documents:
        description: "회사별 최대 공시 건수 (초기 시험은 2건 권장)"
        required: true
        default: "2"

permissions:
  contents: write

concurrency:
  group: insurance-disclosure-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium for dynamic disclosure pages
        run: python -m playwright install --with-deps chromium

      - name: Run selected company collectors
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          EXTRA_ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS+=(--dry-run)
          fi
          if [ -n "${{ inputs.max_documents }}" ]; then
            EXTRA_ARGS+=(--max-documents "${{ inputs.max_documents }}")
          fi
          python scripts/run.py \
            --lookback-years "${{ inputs.lookback_years }}" \
            --companies "${{ inputs.companies }}" \
            "${EXTRA_ARGS[@]}"

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new or changed disclosure data."
          else
            git commit -m "data: update insurance disclosures"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
