name: Collect DB Insurance management disclosures

on:
  # DB's regular-management disclosures are not always posted exactly on
  # quarter-end. Poll monthly to catch late postings and corrected attachments.
  # 00:00 UTC = 09:00 Korea Standard Time.
  schedule:
    - cron: "0 0 5 * *"
  workflow_dispatch:
    inputs:
      lookback_years:
        description: "공시 목록에서 훑을 최근 연수"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: dbins-disclosure-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run collector
        env:
          PYTHONUNBUFFERED: "1"
        run: >-
          python scripts/run.py
          --lookback-years "${{ github.event.inputs.lookback_years || '3' }}"

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new or changed disclosure data."
          else
            git commit -m "data: update DB Insurance disclosures"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
