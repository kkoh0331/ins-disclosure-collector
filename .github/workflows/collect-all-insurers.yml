name: Collect insurance management disclosures

on:
  # Monthly polling catches late quarterly/half-year/annual disclosure postings.
  # 00:00 UTC = 09:00 Korea Standard Time.
  schedule:
    - cron: "0 0 5 * *"
  workflow_dispatch:
    inputs:
      lookback_years:
        description: "공시 목록에서 확인할 최근 연수"
        required: false
        default: "3"
      companies:
        description: "수집 회사 코드 (쉼표 구분, 기본 전체)"
        required: false
        default: "dbins,samsung,kb,meritz,hyundai"
      dry_run:
        description: "목록/PDF 링크 탐색만 실행하고 파일은 저장하지 않음"
        type: boolean
        required: false
        default: true
      max_documents:
        description: "회사별 시험 공시 건수 제한 (빈칸이면 제한 없음)"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: insurance-disclosure-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      
      - name: Install Playwright
        run: |
          python -m pip install "playwright>=1.52,<2"
          python -c "import importlib.metadata; print('Playwright', importlib.metadata.version('playwright'))"
      
      - name: Install Chromium for dynamic disclosure pages
        run: python -m playwright install --with-deps chromium

      - name: Run all company collectors
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          EXTRA_ARGS=()
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            EXTRA_ARGS+=(--dry-run)
          fi
          if [ -n "${{ github.event.inputs.max_documents }}" ]; then
            EXTRA_ARGS+=(--max-documents "${{ github.event.inputs.max_documents }}")
          fi
          python scripts/run.py \
            --lookback-years "${{ github.event.inputs.lookback_years || '3' }}" \
            --companies "${{ github.event.inputs.companies || 'dbins,samsung,kb,meritz,hyundai' }}" \
            "${EXTRA_ARGS[@]}"

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new or changed disclosure data."
          else
            git commit -m "data: update five insurers disclosures"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
